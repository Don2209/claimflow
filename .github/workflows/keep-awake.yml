# Render's free plan sleeps after 15 minutes without visitors, and sleeping wipes the data.
# GitHub can delay scheduled runs, so each run visits several times and the runs overlap.
name: Keep the app awake

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - name: Visit the app every four minutes
        run: |
          for visit in 1 2 3 4 5 6 7; do
            curl --silent --show-error --max-time 90 --output /dev/null --write-out "%{http_code}\n" https://claimsflow.onrender.com/api/health || true
            if [ "$visit" -lt 7 ]; then sleep 240; fi
          done
