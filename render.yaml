# Free demo hosting: data is lost when the app restarts, so use fictional documents only. See README for the paid setup.
# One-click hosting: https://render.com/deploy?repo=https://github.com/Don2209/claimflow
services:
  - type: web
    name: claimsflow
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run product:build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
